        <script>
            // Evening (dark) or daylight, before first paint: the stored choice,
            // else the system preference. Site reads data-theme back.
            (function () {
                var stored = null;
                try { stored = localStorage.getItem('theme'); } catch (e) {}
                var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            })();
        </script>
        <style>
            html { background: #f3f5f0; color-scheme: light; }
            html[data-theme="dark"] { background: #121815; color-scheme: dark; }
